name: Feature request
description: Propose new functionality or an improvement
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and for which persona (treasury, institution, public, auditor, deployer, contributor)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: blueprint
    attributes:
      label: Blueprint fit
      description: Which phase/epic of docs/opentreasury-blueprint.md does this belong to? If it changes a non-goal, note that an ADR with a 30-day comment window is required (GOVERNANCE.md).
