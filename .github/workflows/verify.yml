name: Verify

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/**/go.sum
            workers/**/go.sum
            chaincode/**/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l services workers chaincode)
          if [ -n "$unformatted" ]; then
            echo "gofmt violations:" && echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint (core-api)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.2
          working-directory: services/core-api

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/**/go.sum
            workers/**/go.sum
            chaincode/**/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Install web workspace dependencies
        run: pnpm install --filter @opentreasury/web --filter @opentreasury/types --filter @opentreasury/ui --frozen-lockfile

      - name: Verify
        run: make verify

      - name: Validate compose config
        run: make verify-compose

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: helm lint
        run: helm lint infra/helm/opentreasury

      - name: helm template (default values)
        run: helm template opentreasury infra/helm/opentreasury > /dev/null

      - name: helm template (all components enabled)
        run: |
          helm template opentreasury infra/helm/opentreasury \
            --set database.dsn=postgres://u:p@db:5432/ot \
            --set oidc.issuerUrl=https://id.example.org/realms/opentreasury \
            --set ingress.enabled=true \
            --set connector.enabled=true \
            --set connector.tokenUrl=https://id.example.org/token \
            --set connector.existingSecret=conn-secret \
            --set connector.dropDir.existingClaim=drop-pvc > /dev/null

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/**/go.sum
            workers/**/go.sum
            chaincode/**/go.sum

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for mod in services/core-api services/connectors/generic-file services/ledger-gateway services/mcp-server workers/treasury-worker chaincode/treasury; do
            echo "==> govulncheck in $mod"
            (cd "$mod" && govulncheck ./...)
          done

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level high
