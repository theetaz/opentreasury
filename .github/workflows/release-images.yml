name: Release images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  # Keyless image signing via the GitHub OIDC identity (Sigstore).
  id-token: write

jobs:
  build-and-push:
    name: Build & push (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: core-api
            context: services/core-api
            dockerfile: services/core-api/Dockerfile
          - name: ledger-gateway
            context: services/ledger-gateway
            dockerfile: services/ledger-gateway/Dockerfile
          - name: mcp-server
            context: services/mcp-server
            dockerfile: services/mcp-server/Dockerfile
          - name: generic-file-connector
            context: services/connectors/generic-file
            dockerfile: services/connectors/generic-file/Dockerfile
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, Sigstore)
        run: cosign sign --yes ghcr.io/${{ github.repository }}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image.name }}.spdx.json
          artifact-name: sbom-${{ matrix.image.name }}.spdx.json

      - name: Attest SBOM to the image
        run: |
          cosign attest --yes --type spdxjson \
            --predicate sbom-${{ matrix.image.name }}.spdx.json \
            ghcr.io/${{ github.repository }}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
