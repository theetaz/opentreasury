# cryptogen layout for the local multi-org Fabric network: the treasury and
# an independent audit institution each run a peer, and the chaincode's
# endorsement policy requires BOTH to sign every anchor. All generated
# material lands in generated/ (gitignored) — nothing sensitive is committed.
OrdererOrgs:
  - Name: Orderer
    Domain: opentreasury.local
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer

PeerOrgs:
  - Name: Treasury
    Domain: treasury.opentreasury.local
    EnableNodeOUs: true
    Template:
      Count: 1
    Users:
      Count: 1
  - Name: Audit
    Domain: audit.opentreasury.local
    EnableNodeOUs: true
    Template:
      Count: 1
    Users:
      Count: 1
