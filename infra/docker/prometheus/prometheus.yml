# Prometheus scrape configuration for the local OpenTreasury stack.
# In Kubernetes the same endpoints are discovered via pod annotations
# (see infra/helm/opentreasury).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: core-api
    static_configs:
      - targets: ["core-api:8080"]

  - job_name: ledger-gateway
    static_configs:
      - targets: ["ledger-gateway:9464"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
