# Overlay that repoints the ledger gateway at the local Fabric network
# (see infra/fabric). Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.fabric.yaml up -d ledger-gateway
# The gateway signs as the Treasury org's User1; the enrollment MSP is
# generated by fabric-up and mounted read-only.
services:
  ledger-gateway:
    environment:
      OPENTREASURY_ANCHOR_BACKEND: fabric
      OPENTREASURY_FABRIC_PEER_ENDPOINT: peer0.treasury.opentreasury.local:7051
      OPENTREASURY_FABRIC_MSP_ID: TreasuryMSP
      OPENTREASURY_FABRIC_CERT_PATH: /fabric/msp/signcerts/User1@treasury.opentreasury.local-cert.pem
      OPENTREASURY_FABRIC_KEY_PATH: /fabric/msp/keystore
      OPENTREASURY_FABRIC_TLS_CERT_PATH: /fabric/peer-tls/ca.crt
      OPENTREASURY_FABRIC_CHANNEL: opentreasury
      OPENTREASURY_FABRIC_CHAINCODE: treasury
    volumes:
      - ../fabric/generated/crypto/peerOrganizations/treasury.opentreasury.local/users/User1@treasury.opentreasury.local/msp:/fabric/msp:ro
      - ../fabric/generated/crypto/peerOrganizations/treasury.opentreasury.local/peers/peer0.treasury.opentreasury.local/tls:/fabric/peer-tls:ro
