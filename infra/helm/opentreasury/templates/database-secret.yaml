{{- if and (not .Values.database.existingSecret) .Values.database.dsn }}
# Rendered only when an inline DSN is supplied (development clusters).
# Production deployments should set database.existingSecret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opentreasury.databaseSecretName" . }}
  labels:
    {{- include "opentreasury.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ .Values.database.dsn | quote }}
{{- end }}
