{{- if .Values.mcpServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opentreasury.fullname" . }}-mcp-server
  labels:
    {{- include "opentreasury.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  replicas: {{ .Values.mcpServer.replicas }}
  selector:
    matchLabels:
      {{- include "opentreasury.selectorLabels" (dict "root" . "component" "mcp-server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opentreasury.selectorLabels" (dict "root" . "component" "mcp-server") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "opentreasury.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-server
          image: {{ include "opentreasury.image" (dict "root" . "component" "mcp-server") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          env:
            # The MCP server only speaks to the anonymous public tier.
            - name: OPENTREASURY_PUBLIC_API_URL
              value: http://{{ include "opentreasury.fullname" . }}-core-api:{{ .Values.coreApi.service.port }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            {{- include "opentreasury.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.mcpServer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opentreasury.fullname" . }}-mcp-server
  labels:
    {{- include "opentreasury.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  type: {{ .Values.mcpServer.service.type }}
  ports:
    - name: http
      port: {{ .Values.mcpServer.service.port }}
      targetPort: http
  selector:
    {{- include "opentreasury.selectorLabels" (dict "root" . "component" "mcp-server") | nindent 4 }}
{{- end }}
