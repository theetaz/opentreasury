# Development-cluster PostgreSQL for trying the chart on kind (or any
# throwaway cluster). Production deployments use a managed database or an
# operator instead — see docs/deployment-guide.md.
apiVersion: v1
kind: Secret
metadata:
  name: opentreasury-database
type: Opaque
stringData:
  dsn: postgres://opentreasury:opentreasury@postgres:5432/opentreasury?sslmode=disable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: opentreasury
            - name: POSTGRES_PASSWORD
              value: opentreasury
            - name: POSTGRES_DB
              value: opentreasury
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "opentreasury"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
