openapi: 3.1.0
info:
  title: OpenTreasury Core API
  version: 0.1.0
  description: >-
    Core treasury transaction API for OpenTreasury.


    Conventions: every error response uses the ErrorResponse envelope. Internal
    failures return a sanitized `internal server error` message (details are
    logged server-side with the request ID, never returned). All responses
    carry an `X-Request-ID` header — clients may supply their own. `limit`
    parameters are validated strictly: values outside 1..100 are rejected with
    400 rather than silently clamped. Request bodies above 1 MiB are rejected
    with 413. Cross-origin requests are allowed only for origins configured via
    `OPENTREASURY_ALLOWED_ORIGINS` (methods GET, POST, OPTIONS; header
    Content-Type).
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Get service liveness
      description: Liveness probe. Always returns 200 while the process serves traffic.
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Get service readiness
      description: >-
        Readiness probe. Returns 200 when all dependency checks (such as
        database connectivity) pass, and 503 when any check fails.
      responses:
        "200":
          description: Service is ready to serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: A dependency check failed; the service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /v1/audit-events:
    get:
      operationId: listAuditEvents
      summary: List treasury audit events
      parameters:
        - name: institutionId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Filter audit events by institution identifier.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of audit events to return.
      responses:
        "200":
          description: Matching audit events ordered by most recent occurrence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAuditEventsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Audit event persistence is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/institutions:
    get:
      operationId: listInstitutions
      summary: List treasury institutions
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of institutions to return.
      responses:
        "200":
          description: Treasury institutions ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListInstitutionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Institution persistence is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/transactions/validate:
    post:
      operationId: validateTransaction
      summary: Validate a treasury transaction without persisting it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreasuryTransaction"
      responses:
        "200":
          description: Transaction is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/transactions:
    get:
      operationId: listTransactions
      summary: List treasury transactions
      parameters:
        - name: institutionId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Filter transactions by institution identifier.
        - name: fiscalYear
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Filter transactions by fiscal year.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of transactions to return.
      responses:
        "200":
          description: Matching transactions ordered by most recent transaction date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTransactionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Transaction persistence is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTransaction
      summary: Create a treasury transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreasuryTransaction"
      responses:
        "201":
          description: Transaction was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A transaction with the same identifier already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: The referenced institution does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Transaction persistence is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  responses:
    BadRequest:
      description: Request payload is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: >-
        Unexpected server failure. The message is always the sanitized string
        `internal server error`; diagnostic detail is available to operators
        via server logs keyed by the X-Request-ID header.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request body exceeds the 1 MiB limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
            - unavailable
    TreasuryTransaction:
      type: object
      required:
        - id
        - institutionId
        - fiscalYear
        - amountMinor
        - currency
        - description
        - transactionDate
      properties:
        id:
          type: string
          minLength: 1
          example: txn-2026-0001
        institutionId:
          type: string
          minLength: 1
          example: minfin
        fiscalYear:
          type: integer
          minimum: 1
          example: 2026
        amountMinor:
          type: integer
          minimum: 1
          description: Monetary amount in the currency minor unit.
          example: 125000
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          example: USD
        description:
          type: string
          minLength: 1
          example: Road maintenance payment
        transactionDate:
          type: string
          format: date
          example: "2026-06-28"
    CreateTransactionResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
    ListTransactionsResponse:
      type: object
      required:
        - transactions
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/TreasuryTransaction"
    ListAuditEventsResponse:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
    ListInstitutionsResponse:
      type: object
      required:
        - institutions
      properties:
        institutions:
          type: array
          items:
            $ref: "#/components/schemas/Institution"
    Institution:
      type: object
      required:
        - id
        - name
        - type
        - countryCode
        - status
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - MINISTRY
            - DEPARTMENT
            - AGENCY
            - COUNTY
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
    AuditEvent:
      type: object
      required:
        - id
        - eventType
        - transactionId
        - institutionId
        - occurredAt
        - summary
      properties:
        id:
          type: string
        eventType:
          type: string
          enum:
            - TRANSACTION_CREATED
        transactionId:
          type: string
        institutionId:
          type: string
        occurredAt:
          type: string
          format: date-time
        summary:
          type: string
    ValidationResponse:
      type: object
      required:
        - status
        - code
        - message
        - transactionId
        - institutionId
        - fiscalYear
        - amountMinor
        - currency
        - transactionDate
      properties:
        status:
          type: string
          enum:
            - VALID
        code:
          type: string
          enum:
            - VALIDATION_SUCCESS
        message:
          type: string
        transactionId:
          type: string
        institutionId:
          type: string
        fiscalYear:
          type: integer
        amountMinor:
          type: integer
        currency:
          type: string
        transactionDate:
          type: string
          format: date
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
